<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>간호조직팀 액션 표 · 간트</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b7280;--line:#e5e7eb;--card:#f6f7f9;--c0:#e11d74;--c1:#2563eb;--c2:#16a34a;--c3:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#e8eaed;--mut:#9aa0aa;--line:#2c313a;--card:#1d2026;--c0:#f472b6;--c1:#60a5fa;--c2:#4ade80;--c3:#fbbf24}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#e8eaed;--mut:#9aa0aa;--line:#2c313a;--card:#1d2026;--c0:#f472b6;--c1:#60a5fa;--c2:#4ade80;--c3:#fbbf24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:1200px;margin:0 auto;padding:12px}
section{margin-bottom:20px}
h2{font-size:16px;margin:0 0 8px}
.bar0{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar0 h2{margin:0;margin-right:auto}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
button{cursor:pointer}button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tw{overflow:auto;max-height:48vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;color:var(--mut);padding:6px;border-bottom:1px solid var(--line);z-index:1}
td{padding:4px;border-bottom:1px solid var(--line)}
td input[type=text],td input:not([type]){width:100%}
td.c{text-align:center}td input[type=checkbox]{width:18px;height:18px}
.msg{padding:8px 10px;border-radius:6px;background:var(--card);color:var(--mut);margin-bottom:8px}
.leg{display:flex;gap:10px;font-size:12px;align-items:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#gs{overflow-x:auto;border:1px solid var(--line);border-radius:8px;position:relative}
.gw{position:relative}
.gr{display:flex;border-bottom:1px solid var(--line)}
.gl{position:sticky;left:0;z-index:3;width:64px;flex:none;background:var(--bg);border-right:1px solid var(--line);padding:6px;font-weight:600;font-size:13px}
.ga{position:relative;flex:none}
.hd .ga{height:40px;background:var(--card)}
.hd .gl{background:var(--card)}
.tk{position:absolute;font-size:11px;color:var(--mut);border-left:1px solid var(--line);padding-left:3px;white-space:nowrap}
.bar{position:absolute;height:22px;line-height:22px;font-size:12px;white-space:nowrap;padding-left:5px;border-radius:3px;border-left:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 28%,transparent)}
.bar.dn{text-decoration:line-through;opacity:.55}
.td{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:2;pointer-events:none}
</style></head><body><main>
<section>
  <div class="bar0"><h2>① 액션 표</h2>
    <label>정렬 <select id="sk"><option value="cat">분류</option><option value="start">시작일</option><option value="end">마감일</option><option value="done">완료</option></select></label>
    <button id="sd">오름차순 ↑</button><button id="add" class="pri">+ 행 추가</button></div>
  <div id="msg" class="msg" hidden></div>
  <div id="setup" class="msg">초기 설정 필요: 아래 안내서의 Apps Script 웹 앱 URL을 HTML의 API_URL에 입력하세요.</div>
  <div class="tw"><table id="tbl"><thead><tr><th style="width:84px">분류</th><th style="width:140px">시작일</th><th style="width:140px">마감일</th><th>액션명</th><th style="width:46px">완료</th><th>비고</th><th style="width:56px"></th></tr></thead><tbody></tbody></table></div>
</section>
<section>
  <div class="bar0"><h2>② 간트 차트</h2><div class="leg" id="leg"></div>
    <label>보기 <select id="zm"><option value="24">일</option><option value="10" selected>주</option><option value="4">월</option></select></label>
    <button id="today">오늘로</button></div>
  <div id="gs"></div>
</section>
</main>
<script>
const CATS=["선전","정책","조직","일정"],COL=i=>`var(--c${i})`;
// 배포 후 Google Apps Script 웹 앱 URL을 여기에 입력하세요.
const API_URL = "https://script.google.com/macros/s/AKfycbwM0C_0M_Nbj4Q1KPBns32Y5cami8B7YBlbgOoIoVk6GJmV_YT2pFm-XN6BsLkhdLJb/exec";
const POLL_MS = 5000;
let rows=[],canW=true,sort={k:"cat",d:1},pending=false;
let lastSnapshot="",pollTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dn=s=>s?Math.floor(Date.parse(s+"T00:00:00Z")/864e5):null;
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const todayN=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
$("#leg").innerHTML=CATS.map((c,i)=>`<span><i style="background:${COL(i)}"></i>${c}</span>`).join("");

function sorted(){
  const k=sort.k,d=sort.d;
  const val=r=>k=="cat"?CATS.indexOf(r.cat):k=="done"?(r.done?1:0):(r[k]||null);
  return [...rows].sort((a,b)=>{
    const x=val(a),y=val(b);
    if(x===null&&y!==null)return 1; if(y===null&&x!==null)return -1;
    if(x!==y&&x!==null)return (x<y?-1:1)*d;
    return (a.start||"~").localeCompare(b.start||"~")||(a.ord||0)-(b.ord||0);
  });
}
function renderTable(){
  const dis=canW?"":"disabled";
  $("#tbl tbody").innerHTML=sorted().map(r=>`<tr data-id="${esc(r.id)}">
<td><select data-f="cat" ${dis}>${CATS.map(c=>`<option ${c==r.cat?"selected":""}>${c}</option>`).join("")}</select></td>
<td><input type="date" data-f="start" value="${esc(r.start)}" ${dis}></td>
<td><input type="date" data-f="end" value="${esc(r.end)}" ${dis}></td>
<td><input type="text" data-f="name" value="${esc(r.name)}" ${dis}></td>
<td class="c"><input type="checkbox" data-f="done" ${r.done?"checked":""} ${dis}></td>
<td><input type="text" data-f="note" value="${esc(r.note)}" ${dis}></td>
<td><button data-del ${dis}>삭제</button></td></tr>`).join("");
}
function renderGantt(){
  const dw=+$("#zm").value,T=todayN();
  const items=rows.map(r=>{let s=dn(r.start),e=dn(r.end);if(s==null&&e==null)return null;if(s==null)s=e;if(e==null)e=s;if(s>e)[s,e]=[e,s];return{...r,s,e}}).filter(Boolean);
  let lo=items.length?Math.min(...items.map(i=>i.s)):T,hi=items.length?Math.max(...items.map(i=>i.e)):T+60;
  lo-=7;hi=Math.max(hi+14,lo+45);
  const W=(hi-lo+1)*dw,lanesBy=CATS.map(()=>[]),placed=CATS.map(()=>[]);
  items.sort((a,b)=>a.s-b.s||a.e-b.e).forEach(it=>{
    const ci=Math.max(0,CATS.indexOf(it.cat)),left=(it.s-lo)*dw,w=(it.e-it.s+1)*dw;
    const lw=Math.max(w,String(it.name||"").length*13+12)+6,L=lanesBy[ci];
    let ln=L.findIndex(x=>x<=left);if(ln<0){ln=L.length;L.push(0)}
    L[ln]=left+lw;placed[ci].push({it,left,w,ln});
  });
  let tk="";
  for(let n=lo,m=-1;n<=hi;n++){
    const d=new Date(n*864e5);
    if(d.getUTCMonth()!==m){m=d.getUTCMonth();tk+=`<div class="tk" style="left:${(n-lo)*dw}px;top:2px;font-weight:600">${d.getUTCFullYear()}.${m+1}</div>`}
    if(dw>=24||(dw>=10&&d.getUTCDay()==1))tk+=`<div class="tk" style="left:${(n-lo)*dw}px;top:21px">${d.getUTCDate()}</div>`;
  }
  const grid=dw>=24?`background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px ${dw}px)`:"";
  let h=`<div class="gw" style="width:${W+64}px"><div class="gr hd"><div class="gl"></div><div class="ga" style="width:${W}px">${tk}</div></div>`;
  CATS.forEach((c,ci)=>{
    const hgt=Math.max(1,lanesBy[ci].length)*28+8;
    h+=`<div class="gr"><div class="gl" style="color:${COL(ci)}">${c}</div><div class="ga" style="width:${W}px;height:${hgt}px;${grid}">`+
    placed[ci].map(p=>`<div class="bar${p.it.done?" dn":""}" style="--cc:${COL(ci)};left:${p.left}px;top:${4+p.ln*28}px;width:${p.w}px" title="${esc(p.it.name)} (${ds(p.it.s)} ~ ${ds(p.it.e)})">${esc(p.it.name||"(이름 없음)")}</div>`).join("")+`</div></div>`;
  });
  if(T>=lo&&T<=hi)h+=`<div class="td" style="left:${64+(T-lo)*dw}px;top:0"></div>`;
  $("#gs").innerHTML=h+`</div>`;
  $("#gs").dataset.lo=lo;
}
function scrollToday(){const dw=+$("#zm").value,lo=+$("#gs").dataset.lo,T=todayN();$("#gs").scrollLeft=Math.max(0,(T-lo)*dw-120)}
function render(){renderTable();renderGantt()}
function busy(){const a=document.activeElement;return a&&$("#tbl tbody").contains(a)&&/INPUT|SELECT/.test(a.tagName)}

$("#sk").onchange=e=>{sort.k=e.target.value;renderTable()};
$("#sd").onclick=e=>{sort.d*=-1;e.target.textContent=sort.d>0?"오름차순 ↑":"내림차순 ↓";renderTable()};
$("#zm").onchange=()=>{renderGantt();scrollToday()};
$("#today").onclick=scrollToday;

$("#add").onclick=async()=>{
  if(!ready()) return;
  try { await api("add",{cat:"선전",start:"",end:"",name:"",done:false,note:"",ord:Date.now()}); await refresh(true); }
  catch(e){fail(e)}
};
$("#tbl").addEventListener("change",async e=>{
  const t=e.target,tr=t.closest("tr");
  if(!ready()||!tr||!t.dataset.f)return;
  const value=t.type==="checkbox"?t.checked:t.value;
  try { await api("update",{id:tr.dataset.id,field:t.dataset.f,value}); await refresh(true); }
  catch(err){fail(err)}
});
$("#tbl").addEventListener("click",async e=>{
  const b=e.target.closest("[data-del]");if(!b)return;
  const tr=b.closest("tr");
  if(b.dataset.arm){
    try { await api("delete",{id:tr.dataset.id}); await refresh(true); }
    catch(err){fail(err)}
  } else {
    b.dataset.arm=1;b.textContent="확인?";
    setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="삭제"}},3000)
  }
});
$("#tbl").addEventListener("focusout",()=>setTimeout(()=>{if(pending&&!busy()){pending=false;render()}},50));
function note(t){const m=$("#msg");m.hidden=!t;m.textContent=t||""}
function fail(e){note("저장하지 못했습니다: "+(e&&e.message||"연결 오류")+" — Apps Script 배포 URL과 시트 설정을 확인하세요.")}
function ready(){
  if(!API_URL || API_URL.includes("PASTE_YOUR_")){
    note("초기 설정 필요: HTML의 API_URL에 배포한 Apps Script 웹 앱 URL을 입력하세요.");
    return false;
  }
  return true;
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="gs_cb_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("서버 응답 시간 초과"))},15000);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}
    window[cb]=(data)=>{cleanup();if(data&&data.ok)resolve(data);else reject(new Error(data&&data.error||"API 요청 실패"))};
    script.onerror=()=>{cleanup();reject(new Error("Apps Script에 연결할 수 없습니다"))};
    script.src=API_URL+"?callback="+cb+"&_="+Date.now()+"&"+url;
    document.head.appendChild(script);
  });
}
function api(action,payload={}){
  // Apps Script ContentService/CORS 호환성을 위해 JSONP GET을 사용합니다.
  // 누구나 편집 가능한 공개 링크이므로 URL을 아는 누구나 데이터를 변경할 수 있습니다.
  const params=new URLSearchParams({action,payload:JSON.stringify(payload)});
  return jsonp(params.toString());
}
async function refresh(force=false){
  if(!ready())return;
  try{
    const data=await jsonp("action=list");
    const next=JSON.stringify(data.rows||[]);
    if(force||(!busy()&&next!==lastSnapshot)){
      rows=data.rows||[];
      lastSnapshot=next;
      render();
    } else if(busy()&&next!==lastSnapshot){pending=true}
    $("#setup").hidden=true;
    note("");
  }catch(e){note("데이터 연결 오류: "+(e.message||e))}
}
function startPolling(){
  refresh(true);
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(()=>refresh(false),POLL_MS);
}
renderGantt();
startPolling();

</script></body></html>
